<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>IMPROVS2</title>
<style>
  html,body{margin:0;padding:0;background:#0a0a0f;color:#cbd5e1;font-family:system-ui,sans-serif;}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;}
  #boot h1{font-size:2em;letter-spacing:2px;color:#a78bfa;margin:0;}
  #boot .bar{width:180px;height:4px;background:#1a1a2a;border-radius:2px;overflow:hidden;}
  #boot .fill{height:100%;width:30%;background:linear-gradient(90deg,#38bdf8,#a78bfa);animation:slide 1s ease-in-out infinite;}
  @keyframes slide{0%{margin-left:-30%;}100%{margin-left:100%;}}
  #boot small{color:#556;font-size:0.8em;}
</style>
</head>
<body>
<div id="boot">
  <h1>IMPROVS2</h1>
  <div class="bar"><div class="fill"></div></div>
  <small id="bootMsg">loading latest build…</small>
</div>
<script>
// ── LOADER SHELL (v3 — REDIRECT, not inject) ─────────────────────────────────
// Finds the newest build and REDIRECTS to it. The build then runs as its own page,
// identical to opening builds/app-N.html directly — so the loader can never affect
// its layout, scroll, or styling (the inject approach was doing exactly that).
//
// OAuth: the redirect URI is this /tone3000/ URL. When TONE3000 returns here with
// ?code=…, we forward the FULL query string to the build so its own OAuth handler
// (which reads location.search) still sees the code.
//
// TO RELEASE: upload builds/app-<N>.html. Nothing else.
(function(){
  var MSG=document.getElementById('bootMsg');
  var FLOOR=700, CEIL=999, WINDOW=10, BUILDS='builds/';
  var CACHE='improvs2_newest_build';

  function url(n){ return BUILDS+'app-'+n+'.html'; }
  function exists(path){ return fetch(path,{method:'HEAD',cache:'no-store'}).then(function(r){return r.ok;}).catch(function(){return false;}); }
  function buildExists(n){ return exists(url(n)); }

  function scanUp(start){
    var best=null, n=Math.max(FLOOR,start);
    function step(){
      if(n>CEIL) return Promise.resolve(best);
      var cands=[]; for(var i=0;i<WINDOW && n+i<=CEIL;i++) cands.push(n+i);
      if(!cands.length) return Promise.resolve(best);
      MSG.textContent='probing '+cands[0]+'–'+cands[cands.length-1]+'…';
      return Promise.all(cands.map(buildExists)).then(function(res){
        var hit=null;
        for(var i=cands.length-1;i>=0;i--){ if(res[i]){ hit=cands[i]; break; } }
        if(hit==null) return best;
        best=hit; n=hit+1; return step();
      });
    }
    return step();
  }

  function findBuild(){
    var hasCode=new URLSearchParams(location.search).has('code');
    var cached=parseInt(localStorage.getItem(CACHE)||'',10);
    // OAuth return: reuse the exact build that began the flow.
    if(hasCode && cached>=FLOOR){
      return buildExists(cached).then(function(ok){ return ok?cached:scanUp(FLOOR); });
    }
    // Warm: cached build present → only look for something newer.
    if(cached>=FLOOR){
      return buildExists(cached).then(function(ok){
        if(!ok){ localStorage.removeItem(CACHE); return scanUp(FLOOR); }
        return scanUp(cached+1).then(function(h){ return (h!=null)?h:cached; });
      });
    }
    // Cold: full scan from floor.
    return scanUp(FLOOR);
  }

  findBuild().then(function(n){
    if(n==null){ MSG.innerHTML='No build files found in <code>'+BUILDS+'</code>.'; return; }
    localStorage.setItem(CACHE,String(n));
    MSG.textContent='opening build '+n+'…';
    // carry the OAuth query string (and hash) onto the build URL so its handler still sees ?code=
    var dest=url(n)+location.search+location.hash;
    location.replace(dest);
  }).catch(function(e){
    MSG.textContent='load failed: '+(e&&e.message||e);
  });
})();
</script>
</body>
</html>
